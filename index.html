<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cell Warriors</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <!-- ================= TITLE ================= -->
      <section id="view-title" class="view">
        <div class="title-bg"></div>
        <div class="title-inner">
          <img class="title-logo" src="./images/logo-transparent.png" alt="Cell Warriors" />
          <p class="title-line">Six infections. One body. No backup.</p>
          <button class="primary big" id="btn-start">START</button>
          <button class="ghost tiny" id="btn-reset">reset save</button>
        </div>
      </section>

      <!-- ================= STORY ================= -->
      <section id="view-story" class="view hidden">
        <div class="story-art" id="story-art"></div>
        <div class="story-scrim"></div>
        <div class="story-bar">
          <div class="story-who" id="story-who"></div>
          <div class="story-text" id="story-text"></div>
          <button class="primary" id="btn-story-next">NEXT</button>
        </div>
      </section>

      <!-- ================= MAP ================= -->
      <section id="view-map" class="view hidden">
        <header class="topbar">
          <h1>THE BODY</h1>
          <button class="ghost tiny" id="btn-title">←</button>
        </header>
        <div class="chapter-grid" id="chapter-grid"></div>
      </section>

      <!-- ================= BATTLE ================= -->
      <section id="view-battle" class="view hidden">
        <div class="battle-bg"></div>

        <header class="topbar battle-top">
          <span class="chapter-chip" id="battle-title">I · THE THROAT</span>
          <span class="turn-chip">TURN <b id="turn">1</b></span>
        </header>

        <div class="arena">
          <div class="side party" id="party"></div>
          <div class="arena-mid"><span>VS</span></div>
          <div class="side foes" id="foes"></div>
        </div>

        <div class="battle-log" id="battle-log"></div>

        <footer class="hand-bar">
          <div class="energy" id="energy"></div>
          <div class="hand" id="hand"></div>
          <button class="primary" id="end-turn">END<br />TURN</button>
        </footer>
      </section>

      <!-- ================= RESULT ================= -->
      <div class="overlay hidden" id="overlay">
        <div class="overlay-card">
          <h1 id="overlay-title">—</h1>
          <p id="overlay-sub">—</p>
          <button class="primary big" id="overlay-btn">CONTINUE</button>
          <button class="ghost" id="overlay-retry">RETRY</button>
        </div>
      </div>
    </main>
    <script type="module" src="./src/ui.js"></script>
  </body>
</html>
