<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#06070f" />
    <title>Cell Warriors</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <!-- ================= TITLE ================= -->
      <section id="view-title" class="view">
        <div class="title-bg"></div>
        <div class="title-inner">
          <img class="title-logo" src="./images/logo-transparent.png" alt="Cell Warriors" />
          <p class="title-tag">THE BODY IS THE BATTLEFIELD</p>
          <button class="btn-primary big" id="btn-start">ENTER</button>
          <button class="btn-ghost tiny" id="btn-reset">reset save</button>
        </div>
      </section>

      <!-- ================= ROSTER ================= -->
      <section id="view-roster" class="view hidden">
        <header class="screen-head">
          <div class="head-left">
            <h1>COMBATANTS</h1>
            <span class="head-sub">Pick three. Their decks shuffle together.</span>
          </div>
          <span class="team-count" id="team-count">0 / 3</span>
        </header>
        <div class="roster" id="roster"></div>
        <div class="roster-foot">
          <div class="team-strip" id="team-strip"></div>
          <button class="btn-primary" id="btn-deploy" disabled>DEPLOY</button>
        </div>
      </section>

      <!-- ================= MISSIONS ================= -->
      <section id="view-missions" class="view hidden">
        <header class="screen-head">
          <button class="btn-ghost tiny" id="btn-missions-back">←</button>
          <div class="head-left"><h1>MISSIONS</h1><span class="head-sub" id="mission-team"></span></div>
        </header>
        <div class="mission-list" id="mission-list"></div>
      </section>

      <!-- ================= STORY ================= -->
      <section id="view-story" class="view hidden">
        <div class="story-art" id="story-art"></div>
        <div class="story-scrim"></div>
        <div class="story-bar">
          <div class="story-who" id="story-who"></div>
          <div class="story-text" id="story-text"></div>
          <button class="btn-primary" id="btn-story-next">NEXT</button>
        </div>
      </section>

      <!-- ================= BATTLE ================= -->
      <section id="view-battle" class="view hidden">
        <div class="battle-bg"></div>

        <!-- team HP, portraits, stress -->
        <header class="hud-top">
          <div class="team-block">
            <div class="team-bar">
              <div class="team-fill" id="team-hp-fill"></div>
              <span class="team-num" id="team-hp-num">0 / 0</span>
            </div>
            <div class="team-parts">
              <div class="portraits" id="team-portraits"></div>
              <div class="stress-dots" id="team-stress"></div>
            </div>
          </div>
          <div class="hud-title">
            <b id="b-mission">—</b>
            <span id="b-place">—</span>
          </div>
          <div class="hud-tools">
            <button class="icon-btn" id="log-toggle" title="Battle log">▤</button>
            <button class="icon-btn" id="btn-menu" title="Menu">☰</button>
          </div>
        </header>

        <div class="battle-stage">
          <!-- left rail -->
          <aside class="rail rail-left">
            <div class="turn-plate"><span>TURN</span><b id="b-turn">1</b></div>
            <div class="pile-box" id="draw-pile" title="Draw pile">
              <b id="draw-count">0</b><span>DRAW</span>
            </div>
            <div class="rail-ep">
              <span class="ep-label">EP</span>
              <b id="ep-num">0</b>
              <div class="ep-pips" id="ep-pips"></div>
            </div>
            <div class="ego-stack" id="ego-list"></div>
          </aside>

          <!-- arena -->
          <div class="arena">
            <div class="weak-banner" id="weak-banner"></div>
            <div class="enemy-row" id="enemies"></div>
          </div>

          <!-- right rail -->
          <aside class="rail rail-right">
            <div class="sands-wrap">
              <button class="sands-btn" id="btn-sands" title="Sands of Time">⧗<i id="sands-count">3</i></button>
              <div class="sands-menu hidden" id="sands-menu">
                <button data-sand="1"><b>1</b><span>Undo last card</span></button>
                <button data-sand="2"><b>2</b><span>Redraw Ego</span></button>
                <button data-sand="3"><b>3</b><span>Rewind turn</span></button>
              </div>
            </div>
            <div class="pile-box grave" id="grave-pile" title="Graveyard">
              <b id="grave-count">0</b><i id="grave-used">+0</i><span>GRAVE</span>
            </div>
            <button class="end-turn" id="end-turn" title="End turn"><span>✓</span></button>
          </aside>
        </div>

        <!-- hand -->
        <footer class="hand-zone">
          <div class="hand" id="hand"></div>
          <div class="ap-row">
            <span class="ap-line"></span>
            <b id="ap-now">3</b>
            <span class="ap-line"></span>
          </div>
          <div class="battle-tips" id="battle-tips"></div>
        </footer>

        <div class="battle-log hidden" id="battle-log"></div>
      </section>

      <!-- card cut-in -->
      <div class="cutin hidden" id="cutin">
        <div class="cutin-lines"></div>
        <div class="cutin-flash"></div>
        <img class="cutin-art" id="cutin-art" alt="" />
        <div class="cutin-side">
          <div class="cutin-name" id="cutin-name">—</div>
          <div class="cutin-type" id="cutin-type">—</div>
          <ul class="cutin-fx" id="cutin-fx"></ul>
        </div>
        <div class="cutin-card" id="cutin-card"></div>
      </div>

      <!-- pause -->
      <div class="pause hidden" id="pause">
        <div class="pause-card">
          <h1>PAUSED</h1>
          <button class="btn-primary" id="pause-resume">RESUME</button>
          <button class="btn-ghost" id="pause-restart">RESTART FIGHT</button>
          <button class="btn-ghost" id="pause-quit">QUIT TO MISSIONS</button>
        </div>
      </div>

      <!-- ================= RESULT ================= -->
      <div class="overlay hidden" id="overlay">
        <div class="overlay-card">
          <h1 id="overlay-title">—</h1>
          <p id="overlay-sub">—</p>
          <div class="overlay-stats" id="overlay-stats"></div>
          <button class="btn-primary big" id="overlay-btn">CONTINUE</button>
          <button class="btn-ghost" id="overlay-retry">RETRY</button>
        </div>
      </div>
    </main>
    <script type="module" src="./src/ui.js"></script>
  </body>
</html>
